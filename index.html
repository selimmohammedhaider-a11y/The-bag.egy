<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BAG | Handmade Luxury</title>
    <style>
        /* Importing a high-contrast serif to match TAN St. Canard */
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,900;1,900&display=swap');

        :root { 
            --brand: #000; 
            --bg: #FFFBF5; 
            --dark: #000; 
            --cream: #ede0d4; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--dark); }

        /* Slogan Bar */
        .slogan-bar {
            background: #000;
            color: #fff;
            text-align: center;
            padding: 8px 0;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 300;
        }

        /* Navigation */
        nav { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 15px 5%; 
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--cream);
        }

        .nav-left { display: flex; justify-content: flex-start; }
        .more-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }

        /* Logo using TAN St. Canard style */
        .logo-text { 
            font-family: 'Bodoni Moda', serif; 
            font-size: 2.5rem; 
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
            color: #000;
        }

        .nav-right { display: flex; justify-content: flex-end; align-items: center; }

        /* Custom Cart Icon Image */
        .cart-container {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .cart-icon-img {
            width: 30px; /* Size adjusted to match header scale */
            height: auto;
        }

        .cart-count {
            font-weight: 900;
            font-size: 0.9rem;
        }

        /* Shop Grid */
        .shop { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 50px 8%; }
        .product { position: relative; background: #fff; padding: 15px; border-radius: 40px; text-align: center; }
        .product img { width: 100%; border-radius: 30px; aspect-ratio: 1/1; object-fit: cover; }
        .badge { position: absolute; top: 25px; left: 25px; background: #000; color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 0.65rem; font-weight: 900; }
    </style>
</head>
<body>

    <div class="slogan-bar">
        MADE TO CARRY THE MOMENT
    </div>

    <nav>
        <div class="nav-left"><button class="more-btn">☰</button></div>
        <div class="logo-text">the bag</div>
        <div class="nav-right">
            <div class="cart-container">
                <img src="icon.jfif" class="cart-icon-img" alt="Cart">
                <span class="cart-count">(0)</span>
            </div>
        </div>
    </nav>

    <div class="shop" id="shopGrid"></div>

    <script>
        const products = [
            { id: 'p1', name: 'Balaclava', price: 600, img: 'IMG_7095.JPG' },
            { id: 'p2', name: 'Chevron Peak', price: 900, img: 'Photoroom_20251227_224758.PNG' },
            { id: 'p3', name: 'Rose Classic', price: 900, img: 'Photoroom_20251226_214602.PNG' },
            { id: 'p4', name: 'Ochre Wave', price: 900, img: 'Photoroom_20251226_214200.PNG' },
            { id: 'p5', name: 'Midnight Duo', price: 900, img: 'Photoroom_20251226_210333.PNG' },
            { id: 'p6', name: 'Sand Shell', price: 900, img: 'Photoroom_20251226_220111.PNG' }
        ];

        document.getElementById('shopGrid').innerHTML = products.map(p => `
            <div class="product">
                <div class="badge">ONLY 1 LEFT</div>
                <img src="${p.img}">
                <h3 style="margin-top:20px; font-weight:300;">${p.name}</h3>
                <p style="font-weight:900;">${p.price} EGP</p>
            </div>
        `).join('');
    </script>
</body>
</html>
