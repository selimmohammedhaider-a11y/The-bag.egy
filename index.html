<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BAG | Handmade Luxury</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap');

        :root { --bg: #FFFBF5; --dark: #000; --cream: #ede0d4; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; font-weight: 300; }
        body { background: var(--bg); color: var(--dark); overflow-x: hidden; transition: 0.3s; }
        body.rtl { direction: rtl; }

        /* Navigation */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 5%; background: #fff; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--cream);
        }

        .nav-left { display: flex; align-items: center; gap: 20px; }
        .back-link { cursor: pointer; text-transform: uppercase; font-size: 0.9rem; border-bottom: 1px solid #000; }
        .menu-btn { background: none; border: none; font-size: 1.8rem; cursor: pointer; }

        .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-text { font-family: 'Bodoni Moda', serif; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .lang-btn { cursor: pointer; border: 1px solid #000; padding: 4px 10px; font-size: 0.8rem; }
        .cart-trigger { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .cart-img { width: 24px; height: auto; }

        /* Sidebars */
        .sidebar { position: fixed; top: 0; height: 100%; background: #fff; z-index: 2000; transition: 0.5s; padding: 40px; box-shadow: 0 0 40px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        .sidebar-left { left: -100%; }
        .sidebar-right { right: -100%; }
        .sidebar.active { left: 0; }
        .sidebar-right.active { right: 0; }
        body.rtl .sidebar-left { left: auto; right: -100%; }
        body.rtl .sidebar-left.active { right: 0; }
        body.rtl .sidebar-right { right: auto; left: -100%; }
        body.rtl .sidebar-right.active { left: 0; }

        /* Cart Content */
        .cart-item { display: grid; grid-template-columns: 60px 1fr auto; gap: 15px; margin-bottom: 25px; align-items: center; }
        .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; }
        .qty-box { display: flex; align-items: center; gap: 8px; border: 1px solid #eee; width: fit-content; padding: 2px 8px; border-radius: 20px; }
        .qty-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; }
        .del-btn { color: #ff4d4d; font-size: 0.7rem; cursor: pointer; margin-top: 5px; background: none; border: none; }

        /* Shop Grid */
        .shop-container { padding: 40px 5%; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product { text-align: center; cursor: pointer; }
        .product img { width: 100%; border-radius: 40px; aspect-ratio: 1/1; object-fit: cover; }
        .hidden-item { display: none; }
        .shop-all-active .hidden-item { display: block; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #fff; width: 100%; max-width: 450px; padding: 40px; border-radius: 40px; text-align: center; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-x { position: absolute; top: 20px; right: 20px; cursor: pointer; }

        .btn { width: 100%; padding: 18px; border: none; border-radius: 15px; cursor: pointer; text-transform: uppercase; margin-top: 10px; font-size: 0.9rem; }
        .btn-black { background: #000; color: #fff; }
        .btn-outline { border: 1px solid #000; background: none; }

        /* Forms */
        .form-input { width: 100%; padding: 15px; margin-bottom: 12px; border: 1px solid #eee; border-radius: 10px; background: #fafafa; }
        .about-section { padding: 80px 10%; background: #000; color: #fff; text-align: center; }

        @media (max-width: 768px) {
            .logo-text { font-size: 1.8rem; }
            .sidebar { max-width: 85%; }
        }
    </style>
</head>
<body id="body">

    <nav>
        <div class="nav-left">
            <span class="back-link" onclick="location.reload()" data-en="Back" data-ar="رجوع">Back</span>
            <button class="menu-btn" onclick="toggleMenu('menuSidebar')">☰</button>
        </div>
        <div class="logo-area" onclick="showAll()">
            <span class="logo-text">the bag</span>
            <span style="font-size:1.2rem; margin-left:5px;">→</span>
        </div>
        <div class="nav-right">
            <div class="lang-btn" onclick="toggleLang()">EN/AR</div>
            <div class="cart-trigger" onclick="toggleMenu('cartSidebar')">
                <img src="icon.jfif" class="cart-img">
                <span id="cartCount">(0)</span>
            </div>
        </div>
    </nav>

    <div id="menuSidebar" class="sidebar sidebar-left">
        <div class="close-x" onclick="closeAll()">✕</div>
        <a href="#" class="sidebar-link" onclick="showAll(); closeAll();" data-en="SHOP ALL" data-ar="تسوق الكل">SHOP ALL</a><br><br>
        <a href="#" class="sidebar-link" onclick="scrollToAbout(); closeAll();" data-en="ABOUT US" data-ar="من نحن">ABOUT US</a>
    </div>

    <div id="cartSidebar" class="sidebar sidebar-right">
        <div class="close-x" onclick="closeAll()">✕</div>
        <h2 style="font-family:'Bodoni Moda'; margin-bottom:30px;" data-en="YOUR BAG" data-ar="سلتك">YOUR BAG</h2>
        <div id="cartItemsList" style="flex-grow:1; overflow-y:auto;"></div>
        <div style="border-top:1px solid #eee; padding-top:20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <span data-en="Total" data-ar="الإجمالي">Total</span>
                <span id="cartTotal">0 EGP</span>
            </div>
            <button class="btn btn-black" onclick="openCheckout()" data-en="COMPLETE ORDER" data-ar="إتمام الطلب">COMPLETE ORDER</button>
        </div>
    </div>

    <section class="shop-container">
        <div class="shop-grid" id="grid"></div>
    </section>

    <section class="about-section" id="about">
        <h2 style="font-family:'Bodoni Moda'; margin-bottom:20px;" data-en="ABOUT US" data-ar="من نحن">ABOUT US</h2>
        <p data-en="Handmade in Egypt. Designed to carry the moment." data-ar="صنع يدوياً في مصر. صمم ليحمل أجمل اللحظات.">Handmade in Egypt. Designed to carry the moment.</p>
    </section>

    <div id="prodModal" class="modal" onclick="closeAll()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="close-x" onclick="closeAll()">✕</div>
            <img id="mImg" src="" style="width:100%; border-radius:25px; margin-bottom:20px;">
            <h2 id="mTitle" style="font-family:'Bodoni Moda';"></h2>
            <p id="mPrice" style="margin:10px 0;"></p>
            <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:20px;">
                <span data-en="Quantity" data-ar="الكمية">Quantity</span>
                <div class="qty-box">
                    <button class="qty-btn" onclick="modalQty(-1)">-</button>
                    <span id="mQty">1</span>
                    <button class="qty-btn" onclick="modalQty(1)">+</button>
                </div>
            </div>
            <button class="btn btn-outline" onclick="addToCart()" data-en="ADD TO BAG" data-ar="أضف إلى السلة">ADD TO BAG</button>
            <button class="btn btn-black" onclick="buyNow()" data-en="BUY NOW" data-ar="اشتري الآن">BUY NOW</button>
        </div>
    </div>

    <div id="checkoutModal" class="modal" onclick="closeAll()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="close-x" onclick="closeAll()">✕</div>
            <h2 style="font-family:'Bodoni Moda'; margin-bottom:20px;" data-en="CHECKOUT" data-ar="الدفع">CHECKOUT</h2>
            <form action="https://formspree.io/f/meeoyklk" method="POST" id="checkoutForm">
                <input type="text" name="name" class="form-input" placeholder="Full Name / الاسم بالكامل" required>
                <input type="text" name="phone" class="form-input" placeholder="Phone Number / رقم الهاتف" required>
                <select name="governorate" class="form-input" required>
                    <option value="" disabled selected>Select Governorate / اختر المحافظة</option>
                    <option value="Cairo">Cairo</option><option value="Giza">Giza</option><option value="Alexandria">Alexandria</option>
                    <option value="Dakahlia">Dakahlia</option><option value="Sharqia">Sharqia</option><option value="Monufia">Monufia</option>
                    <option value="Qalyubia">Qalyubia</option><option value="Gharbia">Gharbia</option><option value="Beheira">Beheira</option>
                    <option value="Suez">Suez</option><option value="Port Said">Port Said</option><option value="Ismailia">Ismailia</option>
                </select>
                <input type="text" name="detailed_address" class="form-input" placeholder="Detailed Address / العنوان بالتفصيل" required>
                <textarea name="note" class="form-input" placeholder="Notes / ملاحظات"></textarea>
                
                <div style="text-align:left; margin:10px 0;">
                    <p style="margin-bottom:10px;" data-en="Payment Method" data-ar="طريقة الدفع">Payment Method</p>
                    <label><input type="radio" name="payment" value="COD" checked onclick="toggleVoda(false)"> Cash on Delivery</label><br>
                    <label><input type="radio" name="payment" value="Vodafone" onclick="toggleVoda(true)"> Vodafone Cash</label>
                </div>

                <div id="vodaInfo" style="display:none; background:#f0f0f0; padding:15px; border-radius:10px; font-size:0.85rem; margin-bottom:15px;">
                    Send payment to: <b>01004268823</b><br>
                    Please send a screenshot to our IG or WhatsApp.
                </div>

                <input type="hidden" name="cart_summary" id="formSummary">
                <button type="submit" class="btn btn-black" data-en="PLACE ORDER" data-ar="إتمام الطلب">PLACE ORDER</button>
            </form>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Balaclava', price: 600, img: 'IMG_7095.JPG', hidden: false },
            { id: 2, name: 'Chevron Peak', price: 900, img: 'Photoroom_20251227_224758.PNG', hidden: false },
            { id: 3, name: 'Rose Classic', price: 900, img: 'Photoroom_20251226_214602.PNG', hidden: false },
            { id: 4, name: 'Ochre Wave', price: 900, img: 'Photoroom_20251226_214200.PNG', hidden: true },
            { id: 5, name: 'Midnight Duo', price: 900, img: 'Photoroom_20251226_210333.PNG', hidden: true },
            { id: 6, name: 'Sand Shell', price: 900, img: 'Photoroom_20251226_220111.PNG', hidden: true }
        ];

        let cart = [];
        let curProd = null;
        let curLang = 'en';

        function render() {
            document.getElementById('grid').innerHTML = products.map(p => `
                <div class="product ${p.hidden ? 'hidden-item' : ''}" onclick="openProd(${p.id})">
                    <img src="${p.img}">
                    <h3 style="font-family:'Bodoni Moda'; margin-top:15px; text-transform:uppercase;">${p.name}</h3>
                    <p>${p.price} EGP</p>
                </div>
            `).join('');
        }

        function openProd(id) {
            curProd = products.find(p => p.id === id);
            document.getElementById('mImg').src = curProd.img;
            document.getElementById('mTitle').innerText = curProd.name;
            document.getElementById('mPrice').innerText = curProd.price + " EGP";
            document.getElementById('mQty').innerText = 1;
            document.getElementById('prodModal').style.display = 'flex';
        }

        function modalQty(v) {
            let q = parseInt(document.getElementById('mQty').innerText) + v;
            if (q > 0) document.getElementById('mQty').innerText = q;
        }

        function addToCart() {
            let qty = parseInt(document.getElementById('mQty').innerText);
            let exists = cart.find(i => i.id === curProd.id);
            if (exists) exists.qty += qty;
            else cart.push({...curProd, qty});
            updateCart(); closeAll(); toggleMenu('cartSidebar');
        }

        function buyNow() {
            cart = [{...curProd, qty: parseInt(document.getElementById('mQty').innerText)}];
            updateCart(); closeAll(); openCheckout();
        }

        function updateCart() {
            let total = 0;
            document.getElementById('cartItemsList').innerHTML = cart.map((i, idx) => {
                total += (i.price * i.qty);
                return `<div class="cart-item">
                    <img src="${i.img}">
                    <div>
                        <div style="font-family:'Bodoni Moda'; text-transform:uppercase; font-size:0.9rem;">${i.name} × ${i.qty}</div>
                        <div class="qty-box" style="margin-top:5px;">
                            <button class="qty-btn" onclick="changeCartQty(${idx},-1)">-</button>
                            <span>${i.qty}</span>
                            <button class="qty-btn" onclick="changeCartQty(${idx},1)">+</button>
                        </div>
                        <button class="del-btn" onclick="remove(${idx})">REMOVE</button>
                    </div>
                    <div style="font-size:0.9rem;">${i.price * i.qty} EGP</div>
                </div>`;
            }).join('');
            document.getElementById('cartTotal').innerText = total + " EGP";
            document.getElementById('cartCount').innerText = `(${cart.length})`;
            document.getElementById('formSummary').value = cart.map(i => `${i.name} (x${i.qty})`).join(', ') + " | TOTAL: " + total + " EGP";
        }

        function changeCartQty(idx, v) { cart[idx].qty += v; if (cart[idx].qty < 1) remove(idx); updateCart(); }
        function remove(idx) { cart.splice(idx, 1); updateCart(); }

        function toggleMenu(id) { document.getElementById(id).classList.toggle('active'); }
        function closeAll() { 
            document.querySelectorAll('.sidebar, .modal').forEach(el => { el.classList.remove('active'); el.style.display = 'none'; });
            document.getElementById('prodModal').style.display = 'none';
        }

        function toggleVoda(show) { document.getElementById('vodaInfo').style.display = show ? 'block' : 'none'; }
        function openCheckout() { document.getElementById('checkoutModal').style.display = 'flex'; }
        function showAll() { document.getElementById('grid').classList.add('shop-all-active'); }
        function scrollToAbout() { document.getElementById('about').scrollIntoView({behavior:'smooth'}); }

        function toggleLang() {
            curLang = curLang === 'en' ? 'ar' : 'en';
            document.getElementById('body').classList.toggle('rtl', curLang === 'ar');
            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerText = curLang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-ar');
            });
        }

        render();
    </script>
</body>
</html>
