<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BAG | Handcrafted Crochet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --light-gray: #f9f9f9;
            --transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--white); color: var(--black); line-height: 1.6; }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; z-index: 100;
            display: grid; grid-template-columns: 1fr auto 1fr;
            align-items: center; padding: 25px 5%;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid #eee;
        }
        .nav-links { display: flex; gap: 20px; font-weight: 600; font-size: 12px; letter-spacing: 1px; }
        .logo { font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        .nav-right { display: flex; justify-content: flex-end; gap: 20px; font-weight: 600; font-size: 12px; }
        .nav-item { cursor: pointer; text-decoration: none; color: var(--black); transition: var(--transition); }
        .nav-item:hover { opacity: 0.5; }

        /* --- PRODUCT GRID --- */
        .container { margin-top: 120px; padding: 0 5%; margin-bottom: 100px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
        
        .product-card { cursor: pointer; text-align: center; }
        .image-container { 
            background: var(--light-gray); overflow: hidden; 
            aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
            margin-bottom: 15px; border-radius: 2px;
        }
        .product-card img { 
            width: 100%; transition: var(--transition); 
        }
        .product-card:hover img { transform: scale(1.08); }
        .product-name { font-weight: 600; font-size: 14px; margin-bottom: 5px; }
        .product-price { font-size: 13px; color: #666; }

        /* --- CENTERED PRODUCT MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 1000;
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: var(--transition);
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-content {
            background: white; width: 90%; max-width: 500px; padding: 40px;
            text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            position: relative; transform: translateY(30px); transition: var(--transition);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .close-modal { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 20px; }
        .modal-img { width: 100%; max-width: 300px; margin-bottom: 20px; }
        
        .qty-input {
            width: 100px; padding: 10px; margin: 20px 0; border: 1px solid #ddd;
            text-align: center; font-family: inherit;
        }

        .btn {
            display: block; width: 100%; padding: 18px; margin-top: 10px;
            border: 1px solid var(--black); font-family: inherit;
            font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: var(--transition); font-size: 12px;
        }
        .btn-black { background: var(--black); color: var(--white); }
        .btn-white { background: var(--white); color: var(--black); }
        .btn:hover { background: #333; color: white; border-color: #333; }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .nav-links, .nav-right { display: none; }
            nav { grid-template-columns: 1fr; text-align: center; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-links">
            <div class="nav-item" onclick="toggleSideMenu()">MENU</div>
            <div class="nav-item">ABOUT US</div>
        </div>
        <div class="logo">THE BAG</div>
        <div class="nav-right">
            <a href="https://instagram.com/The_bag.egy" target="_blank" class="nav-item">INSTAGRAM</a>
            <div class="nav-item">CART (0)</div>
        </div>
    </nav>

    <div class="container">
        <div class="grid">
            <div class="product-card" onclick="openProduct('Chevron Blue Tote', '1,200 EGP', 'Photoroom_20251226_210333.PNG')">
                <div class="image-container"><img src="Photoroom_20251226_210333.PNG"></div>
                <div class="product-name">CHEVRON BLUE TOTE</div>
                <div class="product-price">1,200 EGP</div>
            </div>

            <div class="product-card" onclick="openProduct('Earth Tone ZigZag', '1,350 EGP', 'Photoroom_20251226_214200.PNG')">
                <div class="image-container"><img src="Photoroom_20251226_214200.PNG"></div>
                <div class="product-name">EARTH TONE ZIGZAG</div>
                <div class="product-price">1,350 EGP</div>
            </div>

            <div class="product-card" onclick="openProduct('Dusty Rose Crochet', '1,100 EGP', 'Photoroom_20251226_214602.PNG')">
                <div class="image-container"><img src="Photoroom_20251226_214602.PNG"></div>
                <div class="product-name">DUSTY ROSE CROCHET</div>
                <div class="product-price">1,100 EGP</div>
            </div>

            <div class="product-card" onclick="openProduct('Sandy Beige Hobo', '1,250 EGP', 'Photoroom_20251226_220111.PNG')">
                <div class="image-container"><img src="Photoroom_20251226_220111.PNG"></div>
                <div class="product-name">SANDY BEIGE HOBO</div>
                <div class="product-price">1,250 EGP</div>
            </div>

            <div class="product-card" onclick="openProduct('Pink & Purple Chevron', '1,400 EGP', 'Photoroom_20251227_224758.PNG')">
                <div class="image-container"><img src="Photoroom_20251227_224758.PNG"></div>
                <div class="product-name">PINK & PURPLE CHEVRON</div>
                <div class="product-price">1,400 EGP</div>
            </div>

            <div class="product-card" onclick="openProduct('Monochrome Balaclava', '850 EGP', 'IMG_7095.JPG')">
                <div class="image-container"><img src="IMG_7095.JPG"></div>
                <div class="product-name">MONOCHROME BALACLAVA</div>
                <div class="product-price">850 EGP</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="productModal" onclick="closeProduct(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeProduct(null)">✕</span>
            <img id="mImg" class="modal-img" src="">
            <h2 id="mTitle" style="text-transform: uppercase; margin-bottom: 5px;"></h2>
            <p id="mPrice" style="color: #666; font-size: 18px;"></p>
            
            <input type="number" value="1" min="1" class="qty-input">
            
            <button class="btn btn-white" onclick="alert('Added to Cart!')">Add to Cart</button>
            
            <form action="https://formspree.io/f/meeoyklk" method="POST">
                <input type="hidden" name="item" id="formItem">
                <button type="submit" class="btn btn-black">Buy Now</button>
            </form>
        </div>
    </div>

    <script>
        function openProduct(name, price, img) {
            document.getElementById('mTitle').innerText = name;
            document.getElementById('mPrice').innerText = price;
            document.getElementById('mImg').src = img;
            document.getElementById('formItem').value = name;
            document.getElementById('productModal').classList.add('active');
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProduct(e) {
            document.getElementById('productModal').classList.remove('active');
            setTimeout(() => {
                document.getElementById('productModal').style.display = 'none';
            }, 500);
        }
    </script>
</body>
</html>
